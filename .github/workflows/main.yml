name: Prepare TOTK Builder

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install xcodegen cmake ninja opus libvpx python@3.14

      - name: Verify environment
        run: |
          python3.14 --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          echo "=== Available disk ==="
          df -h /
