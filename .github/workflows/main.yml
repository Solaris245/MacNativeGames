name: Inspect MacNativeGames Build

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inspect build requirements
        run: |
          echo "=== Disk space ==="
          df -h /
          echo "=== iOS SDK ==="
          xcrun --sdk iphoneos --show-sdk-version
          echo "=== Build script options ==="
          python3 build_app.py --help
